manifest: data/manifests/patches_diverse.jsonl
patch_dir: data/patches_diverse
output_dir: outputs/ddpm_residual_hard_gated_multiband

diffusion_target: residual
residual_target_type: multiband

detail_sigma: 1.0
lowpass_sigma: 4.0
lowpass_weight: 1.0
highpass_weight: 0.5

base_ckpt: outputs/unet_hard_50k_b6w8/ckpt_best.pt

residual_scale: auto
residual_clip: 0.05
residual_blend: 0.25
eval_blends: [0.0, 0.1, 0.25, 0.5]

residual_gate_mode: hard_modes
residual_gate_hard_modes:
  - mask_dropout
  - mixed_structured
  - lowfreq_atmospheric_bias
  - blur_downsample_upsample
residual_gate_blur: 0
residual_gate_dilate: 0
residual_gate_min_value: 0.0
residual_gate_default_for_hard_modes: 1.0

return_degradation_mask: true
return_reliability_map: true

ddpm_condition_use_mask: true
ddpm_condition_use_reliability: true

ddpm_train_degradation_types:
  - mask_dropout
  - mixed_structured
  - lowfreq_atmospheric_bias
  - blur_downsample_upsample

batch_size: 2
epochs: 1
lr: 1.0e-4
num_workers: 4
max_samples: 128
val_fraction: 0.1
seed: 42

image_size: 256
timesteps: 1000
sampling_steps: 50
sample_every: 500
save_step_train_batch_samples: true
save_step_fixed_val_samples: false
save_every: 1
base_channels: 32
channel_mults: [1, 2, 4, 4]
beta_schedule: cosine

degradation_profile: hard

degradation_probs:
  speckle_multiplicative: 0.26
  blur: 0.04
  downsample_upsample: 0.04
  blur_downsample_upsample: 0.18
  lowfreq_atmospheric_bias: 0.18
  mixed_structured: 0.20
  gaussian_additive: 0.03
  mask_dropout: 0.07

speckle_sigma_min: 0.10
speckle_sigma_max: 0.30
gaussian_sigma_min: 0.06
gaussian_sigma_max: 0.25
blur_sigma_min: 1.0
blur_sigma_max: 3.0
lowfreq_amplitude_min: 0.10
lowfreq_amplitude_max: 0.35
downsample_scale_choices: [2, 4, 4, 4, 4]
mixed_strength_min: 0.05
mixed_strength_max: 0.15
mask_dropout_probability: 0.07
mask_dropout_strength_min: 0.10
mask_dropout_strength_max: 0.30
