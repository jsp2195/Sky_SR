manifest: data/manifests/patches_diverse.jsonl
patch_dir: data/patches_diverse
output_dir: outputs/ddpm_residual_hard

diffusion_target: residual
base_ckpt: outputs/unet_hard/ckpt_best.pt

residual_scale: auto
residual_clip: 0.10
residual_blend: 0.25
eval_blends: [0.0, 0.1, 0.25, 0.5, 1.0]

batch_size: 2
epochs: 1
lr: 1.0e-4
num_workers: 4
max_samples: 128
val_fraction: 0.1
seed: 42

image_size: 256
timesteps: 1000
sampling_steps: 50
sample_every: 500
save_step_train_batch_samples: true
save_step_fixed_val_samples: false
save_every: 1
base_channels: 32
channel_mults: [1, 2, 4, 4]
beta_schedule: cosine

degradation_profile: hard

degradation_probs:
  speckle_multiplicative: 0.26
  blur: 0.04
  downsample_upsample: 0.04
  blur_downsample_upsample: 0.18
  lowfreq_atmospheric_bias: 0.18
  mixed_structured: 0.20
  gaussian_additive: 0.03
  mask_dropout: 0.07

speckle_sigma_min: 0.10
speckle_sigma_max: 0.30
gaussian_sigma_min: 0.06
gaussian_sigma_max: 0.25
blur_sigma_min: 1.0
blur_sigma_max: 3.0
lowfreq_amplitude_min: 0.10
lowfreq_amplitude_max: 0.35
downsample_scale_choices: [2, 4, 4, 4, 4]
mixed_strength_min: 0.05
mixed_strength_max: 0.15
mask_dropout_probability: 0.07
mask_dropout_strength_min: 0.10
mask_dropout_strength_max: 0.30
