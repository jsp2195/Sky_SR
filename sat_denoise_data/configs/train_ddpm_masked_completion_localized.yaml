manifest: data/manifests/patches_diverse.jsonl
patch_dir: data/patches_diverse
output_dir: outputs/ddpm_masked_completion_localized

diffusion_target: masked_completion
base_ckpt: outputs/unet_hard_50k_b6w8/ckpt_best.pt

return_degradation_mask: true
return_reliability_map: true

ddpm_condition_use_mask: true
ddpm_condition_use_reliability: true

masked_completion_target: residual
masked_loss_min_weight: 0.0
masked_context_consistency_weight: 0.0

residual_scale: auto
residual_clip: 0.10
residual_blend: 1.0

degradation_profile: hard

# mixed_structured currently produces all-one masks, so exclude it from the
# localized benchmark. This config intentionally tests spatial completion only.
ddpm_train_degradation_types:
  - mask_dropout

batch_size: 2
epochs: 1
lr: 1.0e-4
num_workers: 4
max_samples: 128
val_fraction: 0.1
seed: 42

image_size: 256
timesteps: 1000
sampling_steps: 50
sample_every: 500
save_step_train_batch_samples: true
save_step_fixed_val_samples: false
save_every: 1
base_channels: 32
channel_mults: [1, 2, 4, 4]
beta_schedule: cosine

mask_area_filter_enabled: true
mask_area_min: 0.02
mask_area_max: 0.40
